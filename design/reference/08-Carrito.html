<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Carrito</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 360px; height: 800px; overflow: hidden; background: #F6F4F0; font-family: Roboto, system-ui, -apple-system, 'Segoe UI', sans-serif; color: #1C1B1A; display: flex; flex-direction: column">
  <header style="height: 56px; flex-shrink: 0; background: #1F5FAD; display: flex; align-items: center; gap: 4px; padding: 0 16px 0 4px; box-sizing: border-box">
    <button aria-label="Regresar" style="width: 48px; height: 48px; padding: 0; border: 0; border-radius: 9999px; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg></button>
    <h1 style="flex: 1; margin: 0; font-size: 18px; line-height: 24px; font-weight: 600; color: #FFFFFF">Mi carrito</h1>
  </header>

  <ul style="flex: 1; overflow: hidden; list-style: none; margin: 0; padding: 12px 16px; display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="4">
      <li style="background: #FFFFFF; border-radius: 16px; box-shadow: 0 1px 2px rgba(28,27,26,0.06), 0 2px 8px rgba(28,27,26,0.06); padding: 12px 4px 12px 12px; display: flex; gap: 12px">
        <div style="width: 72px; height: 72px; flex-shrink: 0; border: 1px solid #EFEBE5; border-radius: 10px; background: #FFFFFF; padding: 6px; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
          <img src="{{it.img}}" alt="" style="max-width: 100%; max-height: 100%; object-fit: contain">
        </div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
          <div style="display: flex; align-items: flex-start; gap: 4px">
            <h3 style="flex: 1; margin: 0; font-size: 14px; line-height: 20px; font-weight: 500; color: #1C1B1A; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{it.title}}</h3>
            <button aria-label="{{it.removeLabel}}" style="width: 48px; height: 48px; margin: -12px 0 -8px; flex-shrink: 0; border: 0; border-radius: 9999px; background: transparent; color: #5E5A55; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M19 6l-1 14H6L5 6"></path><path d="M10 11v6M14 11v6"></path></svg></button>
          </div>
          <p style="margin: 0; font-size: 12px; line-height: 16px; font-weight: 500; color: #5E5A55">{{it.unit}} c/u</p>
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; padding-right: 8px">
            <div style="height: 40px; display: flex; align-items: center; border: 1px solid #CFC8BD; border-radius: 10px; overflow: hidden; background: #FFFFFF">
              <sc-if value="{{it.atMin}}" hint-placeholder-val="{{ true }}">
                <a href="Carrito-Confirmar.dc.html" aria-label="Eliminar producto" style="width: 40px; height: 40px; background: #FFFFFF; color: #C0262D; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M19 6l-1 14H6L5 6"></path><path d="M10 11v6M14 11v6"></path></svg></a>
              </sc-if>
              <sc-if value="{{it.canDec}}" hint-placeholder-val="{{ false }}">
                <button aria-label="Quitar uno" style="width: 40px; height: 40px; border: 0; background: #FFFFFF; color: #1F5FAD; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
              </sc-if>
              <span aria-label="Cantidad" style="min-width: 36px; text-align: center; font-size: 16px; line-height: 22px; font-weight: 600; color: #1C1B1A">{{it.qty}}</span>
              <button aria-label="Agregar uno" style="width: 40px; height: 40px; border: 0; background: #FFFFFF; color: #1F5FAD; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
            </div>
            <p style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 800; color: #C2410C">{{it.total}}</p>
          </div>
        </div>
      </li>
    </sc-for>
  </ul>

  <div style="flex-shrink: 0; background: #FFFFFF; box-shadow: 0 -2px 12px rgba(28,27,26,0.10); padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px">
    <p style="margin: 0; font-size: 14px; line-height: 20px; color: #5E5A55">Productos: 5</p>
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <span style="font-size: 18px; line-height: 24px; font-weight: 600; color: #1C1B1A">Total:</span>
      <span style="font-size: 22px; line-height: 28px; font-weight: 800; color: #1C1B1A">$390.20</span>
    </div>
    <button style="margin-top: 12px; width: 100%; height: 48px; border: 0; border-radius: 10px; background: #1F5FAD; color: #FFFFFF; font-size: 16px; font-weight: 600; cursor: pointer">Ir a checkout</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    var B = '/_blob/';
    var rows = [
      { img: B + '94d128ce78f6a2c3d52f6f465a63bf75', title: 'Mochila Fjallraven Foldsack No. 1, para laptop de hasta 15 pulgadas', unit: '$109.95', qty: 1, total: '$109.95' },
      { img: B + '9770e6ba8a41f8cb71837416a55722f3', title: 'Playeras casuales premium slim fit para hombre', unit: '$22.30', qty: 1, total: '$22.30' },
      { img: B + '6ba07928be2f98a15f4d103ee0dcb694', title: 'Disco duro externo WD 4 TB Gaming Drive, compatible con PlayStation 4', unit: '$114.00', qty: 2, total: '$228.00' },
      { img: B + 'd923d5ae1f0c6f420bb80990b5a71c5a', title: 'Chamarra biker de piel sintética con capucha removible para mujer', unit: '$29.95', qty: 1, total: '$29.95' }
    ];
    return {
      items: rows.map(function (r) {
        return Object.assign({}, r, { atMin: r.qty === 1, canDec: r.qty > 1, removeLabel: 'Eliminar ' + r.title });
      })
    };
  }
}
</script>
</body>
</html>
