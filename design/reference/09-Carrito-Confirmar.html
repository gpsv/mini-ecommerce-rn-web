<div style="width: 360px; height: 800px; overflow: hidden; background: #F6F4F0; font-family: Roboto, system-ui, -apple-system, 'Segoe UI', sans-serif; color: #1C1B1A; display: flex; flex-direction: column; position: relative">

      <span style="flex: 1; font-size: 18px; line-height: 24px; font-weight: 600; color: #FFFFFF">Mi carrito</span>

    <ul style="flex: 1; overflow: hidden; list-style: none; margin: 0; padding: 12px 16px; display: flex; flex-direction: column; gap: 12px">

          </div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
            <div style="display: flex; align-items: flex-start; gap: 4px">
              <span style="flex: 1; font-size: 14px; line-height: 20px; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{it.title}}</span>
              <span style="width: 48px; height: 48px; margin: -12px 0 -8px; flex-shrink: 0; color: #5E5A55; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M19 6l-1 14H6L5 6"></path><path d="M10 11v6M14 11v6"></path></svg></span>
            </div>
            <span style="font-size: 12px; line-height: 16px; font-weight: 500; color: #5E5A55">{{it.unit}} c/u</span>
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; padding-right: 8px">
              <div style="height: 40px; display: flex; align-items: center; border: 1px solid #CFC8BD; border-radius: 10px; overflow: hidden; background: #FFFFFF">
                <sc-if value="{{it.atMin}}" hint-placeholder-val="{{ true }}">
                  <span style="width: 40px; height: 40px; color: #C0262D; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M19 6l-1 14H6L5 6"></path><path d="M10 11v6M14 11v6"></path></svg></span>
                </sc-if>
                <sc-if value="{{it.canDec}}" hint-placeholder-val="{{ false }}">
                  <span style="width: 40px; height: 40px; color: #1F5FAD; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"></path></svg></span>
                </sc-if>
                <span style="min-width: 36px; text-align: center; font-size: 16px; line-height: 22px; font-weight: 600">{{it.qty}}</span>
                <span style="width: 40px; height: 40px; color: #1F5FAD; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></span>
              </div>
              <span style="font-size: 18px; line-height: 24px; font-weight: 800; color: #C2410C">{{it.total}}</span>
            </div>
          </div>
        </li>
      </sc-for>
    </ul>

    <div style="flex-shrink: 0; background: #FFFFFF; box-shadow: 0 -2px 12px rgba(28,27,26,0.10); padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 14px; line-height: 20px; color: #5E5A55">Productos: 5</span>
      <div style="display: flex; align-items: baseline; justify-content: space-between"><span style="font-size: 18px; line-height: 24px; font-weight: 600">Total:</span><span style="font-size: 22px; line-height: 28px; font-weight: 800">$390.20</span></div>
      <span style="margin-top: 12px; height: 48px; border-radius: 10px; background: #1F5FAD; color: #FFFFFF; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center">Ir a checkout</span>
    </div>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(28,27,26,0.56); display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box">
    <div role="alertdialog" aria-modal="true" aria-labelledby="dlg-title" aria-describedby="dlg-desc" style="width: 100%; background: #FFFFFF; border-radius: 16px; box-shadow: 0 12px 40px rgba(28,27,26,0.28); padding: 24px 24px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">

      <h2 id="dlg-title" style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 600; color: #1C1B1A">¿Eliminar este producto del carrito?</h2>
      <div id="dlg-desc" style="display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid #E4DFD7; border-radius: 10px">
        <span style="width: 48px; height: 48px; flex-shrink: 0; border: 1px solid #EFEBE5; border-radius: 8px; padding: 4px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #FFFFFF"><img src="/_blob/94d128ce78f6a2c3d52f6f465a63bf75" alt="" style="max-width: 100%; max-height: 100%; object-fit: contain"></span>
        <span style="font-size: 14px; line-height: 20px; font-weight: 500; color: #1C1B1A">Mochila Fjallraven Foldsack No. 1, para laptop de hasta 15 pulgadas</span>
      </div>
      <div style="display: flex; justify-content: flex-end; gap: 8px">
        <a href="Carrito.dc.html" style="height: 48px; padding: 0 20px; border-radius: 10px; background: transparent; color: #1F5FAD; font-size: 16px; font-weight: 600; display: flex; align-items: center; text-decoration: none">Cancelar</a>
        <button style="height: 48px; padding: 0 20px; border: 0; border-radius: 10px; background: #C0262D; color: #FFFFFF; font-size: 16px; font-weight: 600; cursor: pointer">Eliminar</button>
      </div>
    </div>
  </div>
</div>
