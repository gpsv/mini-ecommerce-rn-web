<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Web · Listado de productos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button,input{font-family:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:0 32px;box-sizing:border-box}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:40px;padding:0 16px;border-radius:9999px;border:1px solid #CFC8BD;background:#FFFFFF;color:#1C1B1A;font-size:14px;font-weight:500;cursor:pointer;flex-shrink:0}
.chip:hover{border-color:#1F5FAD;color:#1F5FAD}
.chip.on{background:#1F5FAD;border-color:#1F5FAD;color:#FFFFFF;font-weight:600}
.card{background:#FFFFFF;border-radius:16px;box-shadow:0 1px 2px rgba(28,27,26,.06),0 2px 8px rgba(28,27,26,.06);overflow:hidden;display:flex;flex-direction:column;transition:transform .15s ease,box-shadow .15s ease;outline:none}
.card:hover,.card.is-hover{transform:translateY(-2px);box-shadow:0 4px 8px rgba(28,27,26,.08),0 12px 28px rgba(28,27,26,.12)}
.card:focus-visible{outline:3px solid #1F5FAD;outline-offset:2px}
.btn{height:44px;border:0;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;flex:1;min-width:0}
.btn-primary{background:#1F5FAD;color:#FFFFFF}
.btn-primary:hover{background:#184F91}
.btn-soft{background:#FFE9DA;color:#9A3412}
.btn-soft:hover{background:#FFDCC4}
.btn:focus-visible,.btn.is-focus{outline:3px solid #1F5FAD;outline-offset:2px}
.cartbtn{position:relative;height:48px;padding:0 16px;border:0;border-radius:9999px;background:rgba(255,255,255,.14);color:#FFFFFF;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;cursor:pointer}
.cartbtn:hover{background:rgba(255,255,255,.24)}
.cartbtn:focus-visible{outline:3px solid #FFFFFF;outline-offset:2px}
.search{flex:0 1 480px}
@media (max-width:1024px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.search{flex:1 1 100%}}
@media (max-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.wrap{padding:0 16px}.chips{flex-wrap:nowrap;overflow-x:auto}.cart-label{display:none}.card-actions{flex-direction:column}}
</style>
</helmet>
<div style="min-height: 100vh; background: #F6F4F0; font-family: Roboto, system-ui, -apple-system, 'Segoe UI', sans-serif; color: #1C1B1A">
  <header style="background: #1F5FAD">
    <div class="wrap" style="height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
      <a href="#" style="display: flex; align-items: center; gap: 12px; text-decoration: none">
        <span style="width: 36px; height: 36px; border-radius: 10px; background: #FFFFFF; color: #1F5FAD; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5"></path><path d="M5 9.5V20h14V9.5"></path><path d="M10 20v-6h4v6"></path></svg></span>
        <span style="font-size: 22px; line-height: 28px; font-weight: 700; color: #FFFFFF">Mi Surtido</span>
      </a>
      <button class="cartbtn" aria-label="Carrito, 5 productos">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"></circle><circle cx="18" cy="20" r="1.5"></circle><path d="M2 3h3l2.6 12.4a2 2 0 0 0 2 1.6h8.3a2 2 0 0 0 2-1.5L22 7H6"></path></svg>
        <span class="cart-label">Carrito</span>
        <span style="min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 9999px; background: #C2410C; color: #FFFFFF; font-size: 12px; line-height: 22px; font-weight: 700; text-align: center">5</span>
      </button>
    </div>
  </header>

  <main class="wrap" style="padding-top: 32px; padding-bottom: 48px">
    <div style="display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap">
      <h1 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 700">Catálogo</h1>
      <span style="font-size: 14px; line-height: 20px; color: #5E5A55">20 productos</span>
    </div>

    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin: 20px 0 28px">
      <label class="search" style="height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: #FFFFFF; border: 1px solid #8A847C; border-radius: 10px; box-sizing: border-box; color: #5E5A55">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input type="search" placeholder="Buscar por nombre" aria-label="Buscar productos por nombre" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 16px; color: #1C1B1A">
      </label>
      <div class="chips" role="group" aria-label="Filtrar por categoría">
        <button class="chip on" aria-pressed="true">Todas</button>
        <button class="chip" aria-pressed="false">Ropa de hombre</button>
        <button class="chip" aria-pressed="false">Ropa de mujer</button>
        <button class="chip" aria-pressed="false">Joyería</button>
        <button class="chip" aria-pressed="false">Electrónica</button>
      </div>
    </div>

    <div class="grid">
      <sc-for list="{{products}}" as="p" hint-placeholder-count="12">
        <article class="{{p.cls}}" tabindex="0">
          <div style="height: 220px; padding: 20px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border-bottom: 1px solid #EFEBE5">
            <img src="{{p.img}}" alt="{{p.title}}" style="max-width: 100%; max-height: 100%; object-fit: contain">
          </div>
          <div style="padding: 16px; display: flex; flex-direction: column; gap: 8px; flex: 1">
            <span style="align-self: flex-start; padding: 2px 8px; border-radius: 9999px; background: #E8EFF8; color: #1A4F8F; font-size: 12px; line-height: 16px; font-weight: 500">{{p.cat}}</span>
            <h3 style="margin: 0; height: 44px; font-size: 16px; line-height: 22px; font-weight: 500; color: #1C1B1A; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{p.title}}</h3>
            <p style="margin: 0; font-size: 24px; line-height: 30px; font-weight: 800; color: #C2410C">{{p.price}}</p>
            <div class="card-actions" style="display: flex; gap: 8px; margin-top: 4px">
              <button class="btn btn-soft">Ver detalle</button>
              <button class="{{p.addCls}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Agregar</button>
            </div>
          </div>
        </article>
      </sc-for>
    </div>

    <div role="status" style="height: 72px; margin-top: 24px; display: flex; align-items: center; justify-content: center; gap: 10px; color: #5E5A55; font-size: 14px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="#D6DFEC"></circle><path d="M21 12a9 9 0 0 0-9-9" stroke="#1F5FAD"></path></svg>
      Cargando más productos…
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1800}}'>
class Component extends DCLogic {
  renderVals() {
    var B = '/_blob/';
    var list = [
      ['94d128ce78f6a2c3d52f6f465a63bf75', 'Ropa de hombre', 'Mochila Fjallraven Foldsack No. 1, para laptop de hasta 15 pulgadas', '$109.95'],
      ['9770e6ba8a41f8cb71837416a55722f3', 'Ropa de hombre', 'Playeras casuales premium slim fit para hombre', '$22.30'],
      ['66d61be7eca926ca43cd81d2968f515e', 'Ropa de hombre', 'Chamarra de algodón para hombre', '$55.99'],
      ['bc159d215464019205fdc4dc9f4f6364', 'Ropa de hombre', 'Camisa casual slim fit para hombre', '$15.99'],
      ['0b62e2dc60bd25a63ca2ec8a1610a472', 'Joyería', 'Pulsera de cadena John Hardy Legends Naga en oro y plata con estación de dragón para mujer', '$695.00'],
      ['84328bc070786a645c70b60a3ab1e257', 'Joyería', 'Anillo petite micropavé de oro sólido', '$168.00'],
      ['2ba5a5488b647cd63d3802d02a424e5d', 'Joyería', 'Anillo princesa chapado en oro blanco', '$9.99'],
      ['aa38f8bf6947aae14d0bfb4a9e9edd64', 'Joyería', 'Aretes dobles Pierced Owl de acero inoxidable chapados en oro rosa', '$10.99'],
      ['6ba07928be2f98a15f4d103ee0dcb694', 'Electrónica', 'Disco duro externo portátil WD 2 TB Elements, USB 3.0', '$64.00'],
      ['660f9a7cd4ce223a880db4b5cdb7bd4d', 'Electrónica', 'SSD interno SanDisk SSD PLUS de 1 TB, SATA III 6 Gb/s', '$109.00'],
      ['e45b8037ce11df1e6a054859195c84f5', 'Electrónica', 'Monitor Acer SB220Q bi de 21.5" Full HD (1920 × 1080) IPS ultradelgado', '$599.00'],
      ['63435f0c65d2c3e5d85d2af2dcaebac9', 'Electrónica', 'Monitor gamer curvo Samsung CHG90 de 49" 144 Hz QLED (LC49HG90DMNXZA)', '$999.99']
    ];
    return {
      products: list.map(function (r, i) {
        return {
          img: B + r[0], cat: r[1], title: r[2], price: r[3],
          cls: i === 1 ? 'card is-hover' : 'card',
          addCls: i === 2 ? 'btn btn-primary is-focus' : 'btn btn-primary'
        };
      })
    };
  }
}
</script>
</body>
</html>
