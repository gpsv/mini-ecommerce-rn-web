<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Web · Carrito</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button,input{font-family:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:0 32px;box-sizing:border-box}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:32px;align-items:start}
.summary{position:sticky;top:96px}
.cartbtn{position:relative;height:48px;padding:0 16px;border:0;border-radius:9999px;background:rgba(255,255,255,.24);color:#FFFFFF;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;cursor:pointer}
.row{background:#FFFFFF;border-radius:16px;box-shadow:0 1px 2px rgba(28,27,26,.06),0 2px 8px rgba(28,27,26,.06);padding:16px;display:flex;gap:16px;align-items:center}
.step{width:44px;height:44px;border:0;background:#FFFFFF;color:#1F5FAD;display:flex;align-items:center;justify-content:center;cursor:pointer}
.step:hover{background:#E8EFF8}
.step:disabled{background:#F3F0EB;color:#B5AFA6;cursor:not-allowed}
.icon{width:48px;height:48px;border:0;border-radius:9999px;background:transparent;color:#5E5A55;display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon:hover{background:#FBE7E8;color:#C0262D}
.btn{width:100%;height:52px;border:0;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;box-sizing:border-box}
.btn-primary{background:#1F5FAD;color:#FFFFFF}
.btn-primary:hover{background:#184F91}
.btn-ghost{background:transparent;color:#1F5FAD;height:48px}
.btn-ghost:hover{background:#E8EFF8}
.step:focus-visible,.icon:focus-visible,.btn:focus-visible{outline:3px solid #1F5FAD;outline-offset:2px}
.title{margin:0;font-size:16px;line-height:22px;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (max-width:1024px){.layout{grid-template-columns:minmax(0,1fr)}.summary{position:static}}
@media (max-width:640px){.wrap{padding:0 16px}.row{flex-wrap:wrap}.thumb{width:72px;height:72px}.cart-label{display:none}}
</style>
</helmet>
<div style="min-height: 100vh; background: #F6F4F0; font-family: Roboto, system-ui, -apple-system, 'Segoe UI', sans-serif; color: #1C1B1A">
  <header style="background: #1F5FAD">
    <div class="wrap" style="height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
      <a href="Web-Listado.dc.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none">
        <span style="width: 36px; height: 36px; border-radius: 10px; background: #FFFFFF; color: #1F5FAD; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5"></path><path d="M5 9.5V20h14V9.5"></path><path d="M10 20v-6h4v6"></path></svg></span>
        <span style="font-size: 22px; line-height: 28px; font-weight: 700; color: #FFFFFF">Mi Surtido</span>
      </a>
      <button class="cartbtn" aria-current="page" aria-label="Carrito, 5 productos">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"></circle><circle cx="18" cy="20" r="1.5"></circle><path d="M2 3h3l2.6 12.4a2 2 0 0 0 2 1.6h8.3a2 2 0 0 0 2-1.5L22 7H6"></path></svg>
        <span class="cart-label">Carrito</span>
        <span style="min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 9999px; background: #C2410C; color: #FFFFFF; font-size: 12px; line-height: 22px; font-weight: 700; text-align: center">5</span>
      </button>
    </div>
  </header>

  <main class="wrap" style="padding-top: 32px; padding-bottom: 64px">
    <h1 style="margin: 0 0 24px; font-size: 28px; line-height: 36px; font-weight: 700">Mi carrito <span style="font-size: 16px; font-weight: 500; color: #5E5A55">(5 productos)</span></h1>

    <div class="layout">
      <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px">
        <sc-for list="{{items}}" as="it" hint-placeholder-count="4">
          <li class="row">
            <div class="thumb" style="width: 96px; height: 96px; flex-shrink: 0; border: 1px solid #EFEBE5; border-radius: 10px; background: #FFFFFF; padding: 8px; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
              <img src="{{it.img}}" alt="" style="max-width: 100%; max-height: 100%; object-fit: contain">
            </div>
            <div style="flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 4px">
              <h3 class="title">{{it.title}}</h3>
              <p style="margin: 0; font-size: 13px; line-height: 18px; font-weight: 500; color: #5E5A55">{{it.unit}} c/u</p>
            </div>
            <div role="group" aria-label="Cantidad" style="display: flex; align-items: center; border: 1px solid #CFC8BD; border-radius: 10px; overflow: hidden; background: #FFFFFF">
              <sc-if value="{{it.atMin}}" hint-placeholder-val="{{ true }}">
                <button class="step" disabled aria-label="Quitar uno"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
              </sc-if>
              <sc-if value="{{it.canDec}}" hint-placeholder-val="{{ false }}">
                <button class="step" aria-label="Quitar uno"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
              </sc-if>
              <span style="min-width: 40px; text-align: center; font-size: 16px; font-weight: 600">{{it.qty}}</span>
              <button class="step" aria-label="Agregar uno"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
            </div>
            <p style="margin: 0; width: 110px; text-align: right; font-size: 20px; line-height: 26px; font-weight: 800; color: #C2410C">{{it.total}}</p>
            <button class="icon" aria-label="{{it.removeLabel}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M19 6l-1 14H6L5 6"></path><path d="M10 11v6M14 11v6"></path></svg></button>
          </li>
        </sc-for>
      </ul>

      <aside class="summary" style="background: #FFFFFF; border-radius: 16px; box-shadow: 0 1px 2px rgba(28,27,26,0.06), 0 2px 8px rgba(28,27,26,0.06); padding: 24px; display: flex; flex-direction: column; gap: 12px">
        <h2 style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 600">Resumen</h2>
        <div style="display: flex; justify-content: space-between; font-size: 15px; line-height: 22px; color: #5E5A55"><span>Productos: 5</span><span>$390.20</span></div>
        <hr style="width: 100%; margin: 4px 0; border: 0; border-top: 1px solid #E4DFD7">
        <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 18px; line-height: 24px; font-weight: 600">Total:</span><span style="font-size: 28px; line-height: 34px; font-weight: 800">$390.20</span></div>
        <a class="btn btn-primary" href="Web-Checkout.dc.html" style="margin-top: 8px">Ir a checkout</a>
        <a class="btn btn-ghost" href="Web-Listado.dc.html">Seguir comprando</a>
      </aside>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    var B = '/_blob/';
    var rows = [
      { img: B + '94d128ce78f6a2c3d52f6f465a63bf75', title: 'Mochila Fjallraven Foldsack No. 1, para laptop de hasta 15 pulgadas', unit: '$109.95', qty: 1, total: '$109.95' },
      { img: B + '9770e6ba8a41f8cb71837416a55722f3', title: 'Playeras casuales premium slim fit para hombre', unit: '$22.30', qty: 1, total: '$22.30' },
      { img: B + '6ba07928be2f98a15f4d103ee0dcb694', title: 'Disco duro externo WD 4 TB Gaming Drive, compatible con PlayStation 4', unit: '$114.00', qty: 2, total: '$228.00' },
      { img: B + 'd923d5ae1f0c6f420bb80990b5a71c5a', title: 'Chamarra biker de piel sintética con capucha removible para mujer', unit: '$29.95', qty: 1, total: '$29.95' }
    ];
    return {
      items: rows.map(function (r) {
        return Object.assign({}, r, { atMin: r.qty === 1, canDec: r.qty > 1, removeLabel: 'Eliminar ' + r.title });
      })
    };
  }
}
</script>
</body>
</html>
