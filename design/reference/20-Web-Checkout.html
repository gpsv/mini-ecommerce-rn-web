<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Web · Checkout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button,input{font-family:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:0 32px;box-sizing:border-box}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:32px;align-items:start}
.summary{position:sticky;top:96px}
.cartbtn{position:relative;height:48px;padding:0 16px;border:0;border-radius:9999px;background:rgba(255,255,255,.14);color:#FFFFFF;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;cursor:pointer}
.cartbtn:hover{background:rgba(255,255,255,.24)}
.field{display:flex;flex-direction:column;gap:6px}
.label{font-size:14px;line-height:20px;font-weight:500;color:#1C1B1A}
.input{height:48px;padding:0 14px;box-sizing:border-box;border:1px solid #8A847C;border-radius:10px;background:#FFFFFF;font-size:16px;color:#1C1B1A;outline:none}
.input:hover{border-color:#1C1B1A}
.input:focus,.input.is-focus{border:2px solid #1F5FAD;padding:0 13px;box-shadow:0 0 0 3px rgba(31,95,173,.20)}
.input.err{border:2px solid #C0262D;padding:0 13px}
.btn{width:100%;height:52px;border:0;border-radius:10px;background:#1F5FAD;color:#FFFFFF;font-size:16px;font-weight:600;cursor:pointer}
.btn:hover{background:#184F91}
.btn:focus-visible{outline:3px solid #1F5FAD;outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:1024px){.layout{grid-template-columns:minmax(0,1fr)}.summary{position:static;order:-1}}
@media (max-width:640px){.wrap{padding:0 16px}.grid2{grid-template-columns:minmax(0,1fr)}.cart-label{display:none}}
</style>
</helmet>
<div style="min-height: 100vh; background: #F6F4F0; font-family: Roboto, system-ui, -apple-system, 'Segoe UI', sans-serif; color: #1C1B1A">
  <header style="background: #1F5FAD">
    <div class="wrap" style="height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
      <a href="Web-Listado.dc.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none">
        <span style="width: 36px; height: 36px; border-radius: 10px; background: #FFFFFF; color: #1F5FAD; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5"></path><path d="M5 9.5V20h14V9.5"></path><path d="M10 20v-6h4v6"></path></svg></span>
        <span style="font-size: 22px; line-height: 28px; font-weight: 700; color: #FFFFFF">Mi Surtido</span>
      </a>
      <button class="cartbtn" aria-label="Carrito, 5 productos">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"></circle><circle cx="18" cy="20" r="1.5"></circle><path d="M2 3h3l2.6 12.4a2 2 0 0 0 2 1.6h8.3a2 2 0 0 0 2-1.5L22 7H6"></path></svg>
        <span class="cart-label">Carrito</span>
        <span style="min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 9999px; background: #C2410C; color: #FFFFFF; font-size: 12px; line-height: 22px; font-weight: 700; text-align: center">5</span>
      </button>
    </div>
  </header>

  <main class="wrap" style="padding-top: 32px; padding-bottom: 64px">
    <h1 style="margin: 0 0 24px; font-size: 28px; line-height: 36px; font-weight: 700">Checkout</h1>

    <div class="layout">
      <form style="background: #FFFFFF; border-radius: 16px; box-shadow: 0 1px 2px rgba(28,27,26,0.06), 0 2px 8px rgba(28,27,26,0.06); padding: 32px; display: flex; flex-direction: column; gap: 20px">
        <div>
          <h2 style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 600">Datos de contacto</h2>
          <p style="margin: 4px 0 0; font-size: 14px; line-height: 20px; color: #5E5A55">Usaremos estos datos para confirmar tu pedido. Compra simulada: no se realiza ningún cobro.</p>
        </div>
        <div class="field">
          <label class="label" for="w-nombre">Nombre</label>
          <input class="input" id="w-nombre" type="text" value="María López" autocomplete="name">
        </div>
        <div class="grid2">
          <div class="field">
            <label class="label" for="w-correo">Correo</label>
            <input class="input err" id="w-correo" type="email" value="maria.lopez@correo" aria-invalid="true" aria-describedby="w-correo-err" autocomplete="email">
            <p id="w-correo-err" style="margin: 0; display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; font-weight: 500; color: #C0262D"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5M12 16.5h.01"></path></svg>Ingresa un correo válido</p>
          </div>
          <div class="field">
            <label class="label" for="w-tel">Teléfono</label>
            <input class="input is-focus" id="w-tel" type="tel" inputmode="numeric" maxlength="10" placeholder="10 dígitos" value="44312345" aria-describedby="w-tel-help" autocomplete="tel">
            <p id="w-tel-help" style="margin: 0; font-size: 12px; line-height: 16px; font-weight: 500; color: #5E5A55">10 dígitos, sin espacios ni guiones</p>
          </div>
        </div>
      </form>

      <aside class="summary" style="background: #FFFFFF; border-radius: 16px; box-shadow: 0 1px 2px rgba(28,27,26,0.06), 0 2px 8px rgba(28,27,26,0.06); padding: 24px; display: flex; flex-direction: column; gap: 14px">
        <h2 style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 600">Resumen del pedido</h2>
        <sc-for list="{{lines}}" as="l" hint-placeholder-count="4">
          <div style="display: flex; align-items: center; gap: 12px">
            <span style="width: 48px; height: 48px; flex-shrink: 0; border: 1px solid #EFEBE5; border-radius: 8px; padding: 4px; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><img src="{{l.img}}" alt="" style="max-width: 100%; max-height: 100%; object-fit: contain"></span>
            <span style="flex: 1; min-width: 0; font-size: 14px; line-height: 20px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap"><span style="font-weight: 600">{{l.qty}} ×</span> {{l.title}}</span>
            <span style="font-size: 14px; line-height: 20px; font-weight: 600">{{l.total}}</span>
          </div>
        </sc-for>
        <hr style="width: 100%; margin: 2px 0; border: 0; border-top: 1px solid #E4DFD7">
        <div style="display: flex; justify-content: space-between; font-size: 15px; line-height: 22px; color: #5E5A55"><span>Productos</span><span>5</span></div>
        <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 18px; line-height: 24px; font-weight: 600">Total</span><span style="font-size: 28px; line-height: 34px; font-weight: 800">$390.20</span></div>
        <button class="btn" type="submit" style="margin-top: 6px">Confirmar compra</button>
      </aside>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    var B = '/_blob/';
    return {
      lines: [
        { img: B + '94d128ce78f6a2c3d52f6f465a63bf75', qty: 1, title: 'Mochila Fjallraven Foldsack No. 1, para laptop de hasta 15 pulgadas', total: '$109.95' },
        { img: B + '9770e6ba8a41f8cb71837416a55722f3', qty: 1, title: 'Playeras casuales premium slim fit para hombre', total: '$22.30' },
        { img: B + '6ba07928be2f98a15f4d103ee0dcb694', qty: 2, title: 'Disco duro externo WD 4 TB Gaming Drive, compatible con PlayStation 4', total: '$228.00' },
        { img: B + 'd923d5ae1f0c6f420bb80990b5a71c5a', qty: 1, title: 'Chamarra biker de piel sintética con capucha removible para mujer', total: '$29.95' }
      ]
    };
  }
}
</script>
</body>
</html>
